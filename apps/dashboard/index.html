<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Installable, unlike the storefront. An owner behind their counter
         opening an icon straight into their order queue is the whole point,
         and it is what makes web push possible on iOS later. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12120f" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS ignores the manifest's display mode; these are its equivalent. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChopChop" />

    <!-- Deliberately generic: one deployment serves every tenant, so the
         document title is set at runtime from the tenant row. -->
    <title>ChopChop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
